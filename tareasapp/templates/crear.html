<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Ticket - HelpDesk</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: white; padding: 35px; border-radius: 10px; width: 100%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { font-size: 1.5rem; color: #1e293b; margin-bottom: 20px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #475569; font-weight: 600; font-size: 0.9rem; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
        textarea { resize: vertical; height: 100px; }
        .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
        .btn { padding: 10px 18px; border-radius: 6px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; font-size: 0.9rem; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-secondary { background-color: #94a3b8; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reportar Nueva Incidencia</h2>
        <form id="crearForm">
            <div class="form-group">
                <label for="titulo">Asunto del Problema:</label>
                <input type="text" id="titulo" placeholder="Ej: Falla en impresora de contabilidad" required>
            </div>
            
            <div class="form-group">
                <label for="descripcion">Detalles del Error / Equipo afectado:</label>
                <textarea id="descripcion" placeholder="Describe brevemente la falla reportada..."></textarea>
            </div>

            <div class="actions">
                <a href="/" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Guardar Ticket</button>
            </div>
        </form>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login/';

        document.getElementById('crearForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const titulo = document.getElementById('titulo').value;
            const descripcion = document.getElementById('descripcion').value;

            const res = await fetch('/api/v1/tareas/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Token ${token}`
                },
                body: JSON.stringify({ titulo, descripcion, completada: false })
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                alert('Error al crear el ticket de incidencia');
            }
        });
    </script>
</body>
</html>
