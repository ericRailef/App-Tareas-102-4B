<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerrar/Eliminar Ticket - HelpDesk</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: white; padding: 35px; border-radius: 10px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        h2 { font-size: 1.4rem; color: #1e293b; margin-bottom: 12px; }
        p { color: #64748b; font-size: 0.95rem; margin-bottom: 25px; }
        .actions { display: flex; justify-content: center; gap: 12px; }
        .btn { padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; font-size: 0.9rem; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-secondary { background-color: #94a3b8; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2>¿Eliminar esta Incidencia?</h2>
        <p>Esta acción eliminará el ticket de soporte de la base de datos de forma permanente.</p>

        <div class="actions">
            <a href="/" class="btn btn-secondary">Cancelar</a>
            <button id="btnConfirmar" class="btn btn-danger">Confirmar Eliminación</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login/';

        const ticketId = "{{ id }}";

        document.getElementById('btnConfirmar').addEventListener('click', async () => {
            const res = await fetch(`/api/v1/tareas/${ticketId}/`, {
                method: 'DELETE',
                headers: { 'Authorization': `Token ${token}` }
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                alert('Error al eliminar la incidencia.');
            }
        });
    </script>
</body>
</html>
