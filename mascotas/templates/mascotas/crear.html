{% extends 'mascotas/base.html' %}
{% block titulo %}Registrar mascota{% endblock %}

{% block contenido %}
<div class="card mx-auto" style="max-width: 600px;">
    <div class="card-header bg-success text-white"><h4 class="mb-0">➕ Registrar nueva mascota</h4></div>
    <div class="card-body">
        <form method="POST" novalidate>
            {% csrf_token %}
            {% for campo in form %}
                <div class="mb-3">
                    <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
                    {{ campo }}
                    {% for error in campo.errors %}
                        <div class="text-danger small">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-success">Guardar mascota</button>
            <a href="{% url 'listar_mascotas' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>

<script>
    // Estilo Bootstrap a los campos del formulario
    document.querySelectorAll('input, select, textarea').forEach(function (el) {
        if (el.type !== 'hidden') el.classList.add(el.tagName === 'SELECT' ? 'form-select' : 'form-control');
    });
</script>
{% endblock %}
